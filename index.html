<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Order Form</title>
    <style>
        body { 
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 {
            color: #c5a028;
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 6px;
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 6px;
            text-align: center;
            margin-top: 20px;
            font-size: 16px;
        }
        .loading {
            text-align: center;
            color: #666;
            font-size: 16px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🥇 Gold Booking System</h1>
        <div id="status" class="loading">Loading Firebase...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-compat/app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-compat/firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-compat/storage.js"></script>

    <script>
        console.log("Script started");
        
        const firebaseConfig = {
            apiKey: "AIzaSyCPjnhrb6IGmmDiDSVkmesO7-dewm_6-aI",
            authDomain: "gold-orders.firebaseapp.com",
            projectId: "gold-orders",
            storageBucket: "gold-orders.firebasestorage.app",
            messagingSenderId: "889006387701",
            appId: "1:889006387701:web:c567caa1ec22f95697b0bc"
        };

        let retries = 0;
        const maxRetries = 50;

        function tryInitialize() {
            retries++;
            console.log(`Attempt ${retries}: Checking for firebase...`);
            
            if (typeof firebase !== 'undefined') {
                console.log("✅ Firebase object found!");
                initFirebase();
            } else if (retries < maxRetries) {
                console.log(`Firebase not ready yet, waiting...`);
                setTimeout(tryInitialize, 100);
            } else {
                console.error("❌ Firebase failed to load after retries");
                document.getElementById('status').innerHTML = '<div class="error">❌ Failed to load Firebase</div>';
            }
        }

        function initFirebase() {
            try {
                console.log("Initializing Firebase...");
                firebase.initializeApp(firebaseConfig);
                console.log("✅ Firebase initialized");
                
                const db = firebase.firestore();
                console.log("✅ Firestore ready");
                
                const storage = firebase.storage();
                console.log("✅ Storage ready");
                
                document.getElementById('status').innerHTML = '<div class="success">✅ System Connected Successfully!</div>';
                console.log("✅✅✅ ALL SYSTEMS GO ✅✅✅");
                
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('status').innerHTML = '<div class="error">❌ Error: ' + error.message + '</div>';
            }
        }

        // Start checking for Firebase
        tryInitialize();
    </script>
</body>
</html>
