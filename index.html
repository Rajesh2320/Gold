<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Order Form</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 {
            color: #c5a028;
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #28a745;
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #dc3545;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🥇 Gold Booking System</h1>
        <p class="subtitle">Secure Gold Orders & Payments</p>
        
        <div id="loadingMessage" class="loading">
            ⏳ Loading system... Please wait
        </div>

        <div id="mainContent" style="display: none;">
            <div id="successMessage" class="success-message" style="display: none;"></div>
            <div id="errorMessage" class="error-message" style="display: none;"></div>
            
            <p style="text-align: center; color: #28a745; margin: 20px 0; font-weight: bold; font-size: 18px;">
                ✅ System Connected Successfully!
            </p>
            
            <div style="background: #f0f8ff; padding: 20px; border-radius: 8px; text-align: center;">
                <p style="color: #333; margin: 10px 0;">Your Gold Booking System is ready</p>
                <p style="color: #666; margin: 10px 0; font-size: 14px;">Database connection verified ✅</p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js"></script>
    <script src="https://unpkg.com/@emailjs/browser@4/dist/email.min.js"></script>

    <script>
        // ✅ IMPORTANT - API KEY IS NOT HERE!
        // It comes from Vercel environment variables via /api/config
        // This keeps your secrets SAFE and OFF GitHub!

        let firebaseConfig = {};

        async function loadConfig() {
            try {
                console.log("📡 Loading Firebase config from Vercel...");
                const response = await fetch('/api/config');
                
                if (!response.ok) {
                    throw new Error(`Failed to load config: ${response.status}`);
                }
                
                firebaseConfig = await response.json();
                console.log("✅ Firebase config loaded successfully");
                console.log("Project ID:", firebaseConfig.projectId);
                
                initializeFirebase();
            } catch (error) {
                console.error("❌ Error loading config:", error);
                document.getElementById('loadingMessage').innerHTML = 
                    '<div class="error-message"><strong>❌ Error:</strong> ' + error.message + '</div>';
            }
        }

        function initializeFirebase() {
            try {
                // Wait for Firebase to be available
                if (typeof firebase === 'undefined') {
                    console.error("❌ Firebase not loaded yet");
                    setTimeout(initializeFirebase, 500);
                    return;
                }

                console.log("🔧 Initializing Firebase with config...");
                
                // Check if already initialized
                if (firebase.apps && firebase.apps.length > 0) {
                    console.log("✅ Firebase already initialized");
                } else {
                    firebase.initializeApp(firebaseConfig);
                }
                
                const db = firebase.firestore();
                const storage = firebase.storage();
                
                console.log("✅ Firebase initialized successfully");
                
                // Initialize EmailJS
                if (typeof emailjs !== 'undefined') {
                    emailjs.init("8KaDRKTZiJkhff6TU");
                    console.log("✅ EmailJS initialized");
                }
                
                // Show success screen
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                
            } catch (error) {
                console.error("❌ Firebase initialization error:", error);
                document.getElementById('loadingMessage').innerHTML = 
                    '<div class="error-message"><strong>❌ Error:</strong> ' + error.message + '</div>';
            }
        }

        // Load config when page loads
        window.addEventListener('load', loadConfig);
    </script>
</body>
</html>
