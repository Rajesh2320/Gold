<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Bullion Booking</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 40px; }
        h1 { color: #c5a028; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input, select, textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-family: inherit; }
        input:focus, select:focus { outline: none; border-color: #c5a028; }
        button { width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 20px; }
        button:hover { background: #229954; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .success { background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin: 15px 0; }
        .error { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; margin: 15px 0; }
        .info { background: #d1ecf1; color: #0c5460; padding: 15px; border-radius: 8px; margin: 15px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>🥇 Gold Bullion Order</h1>
    
    <div id="statusMessage"></div>
    
    <form id="orderForm">
        <div class="form-group">
            <label>Customer Name *</label>
            <input type="text" id="custName" required>
        </div>
        
        <div class="form-group">
            <label>Email *</label>
            <input type="email" id="custEmail" required>
        </div>
        
        <div class="form-group">
            <label>Phone *</label>
            <input type="tel" id="custPhone" required>
        </div>
        
        <div class="form-group">
            <label>Gold Weight (grams) *</label>
            <select id="goldWeight" required>
                <option value="">-- Select --</option>
                <option value="250">250g - ₹500</option>
                <option value="500">500g - ₹1000</option>
                <option value="1000">1000g - ₹2000</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Quantity *</label>
            <input type="number" id="goldQuantity" min="1" required>
        </div>
        
        <div class="form-group">
            <label>Delivery Address *</label>
            <textarea id="deliveryAddress" required></textarea>
        </div>
        
        <div class="form-group">
            <label>PIN Code *</label>
            <input type="text" id="pinCode" required>
        </div>
        
        <button type="button" onclick="submitOrder()" id="submitBtn">📝 Submit Order</button>
    </form>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxZeJ-JckroohgTNh4BowL_zGvGaWS4ZXqYionJuf-W3MEiKwrO9-92gzk8TfrSdBCDcg/exec";
    
    async function submitOrder() {
        const name = document.getElementById("custName").value;
        const email = document.getElementById("custEmail").value;
        const phone = document.getElementById("custPhone").value;
        const weight = document.getElementById("goldWeight").value;
        const qty = document.getElementById("goldQuantity").value;
        const address = document.getElementById("deliveryAddress").value;
        const pincode = document.getElementById("pinCode").value;
        
        if (!name || !email || !phone || !weight || !qty || !address || !pincode) {
            showMessage("❌ Please fill all fields", "error");
            return;
        }
        
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "⏳ Processing...";
        
        try {
            const totalKg = (parseInt(weight) * parseInt(qty)) / 1000;
            const price = getPriceForWeight(parseInt(weight));
            const totalAmount = price * parseInt(qty);
            
            const orderData = {
                action: "submitOrder",
                orderId: "ORD" + Date.now(),
                customerName: name,
                customerEmail: email,
                customerPhone: phone,
                weightGrams: weight,
                quantity: qty,
                totalKg: totalKg,
                amount: totalAmount,
                address: address,
                pinCode: pincode
            };
            
            const response = await fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify(orderData)
            });
            
            showMessage("✅ Order submitted successfully! Order ID: " + orderData.orderId, "success");
            document.getElementById("orderForm").reset();
            
        } catch (error) {
            showMessage("❌ Error: " + error.message, "error");
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "📝 Submit Order";
        }
    }
    
    function getPriceForWeight(weight) {
        if (weight == 250) return 500;
        if (weight == 500) return 1000;
        if (weight == 1000) return 2000;
        return 500;
    }
    
    function showMessage(msg, type) {
        const msgDiv = document.getElementById("statusMessage");
        msgDiv.className = type;
        msgDiv.innerText = msg;
        setTimeout(() => { msgDiv.innerText = ""; }, 5000);
    }
</script>

</body>
</html>
