<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Order Form</title>
    <style>
        body { 
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 {
            color: #c5a028;
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 6px;
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 6px;
            text-align: center;
            margin-top: 20px;
            font-size: 16px;
        }
        .loading {
            text-align: center;
            color: #666;
            font-size: 16px;
            margin-top: 20px;
        }
        .debug {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🥇 Gold Booking System</h1>
        <div id="status" class="loading">Loading Firebase...</div>
        <div id="debug" class="debug"></div>
    </div>

    <!-- Try multiple Firebase CDN sources -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js" onerror="logError('CDN 1 failed')"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js" onerror="logError('CDN 2 failed')"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js" onerror="logError('CDN 3 failed')"></script>

    <script>
        const debugLog = [];
        
        function log(msg) {
            console.log(msg);
            debugLog.push(msg);
            updateDebug();
        }
        
        function logError(msg) {
            console.error(msg);
            debugLog.push("❌ " + msg);
            updateDebug();
        }
        
        function updateDebug() {
            const debugDiv = document.getElementById('debug');
            debugDiv.innerHTML = debugLog.map(m => m + '<br>').join('');
            debugDiv.scrollTop = debugDiv.scrollHeight;
        }

        log("Page loaded");
        
        const firebaseConfig = {
            apiKey: "AIzaSyCPjnhrb6IGmmDiDSVkmesO7-dewm_6-aI",
            authDomain: "gold-orders.firebaseapp.com",
            projectId: "gold-orders",
            storageBucket: "gold-orders.firebasestorage.app",
            messagingSenderId: "889006387701",
            appId: "1:889006387701:web:c567caa1ec22f95697b0bc"
        };

        let retries = 0;
        const maxRetries = 100;

        function tryInitialize() {
            retries++;
            
            if (retries % 10 === 0) {
                log(`Waiting for Firebase... (${retries}ms)`);
            }
            
            if (typeof firebase !== 'undefined') {
                log("✅ Firebase object found!");
                initFirebase();
            } else if (retries < maxRetries) {
                setTimeout(tryInitialize, 100);
            } else {
                logError("Firebase failed to load after 10 seconds");
                document.getElementById('status').innerHTML = '<div class="error">❌ Firebase CDN not responding. Check your internet connection.</div>';
            }
        }

        function initFirebase() {
            try {
                log("Initializing Firebase...");
                
                if (firebase.apps.length === 0) {
                    firebase.initializeApp(firebaseConfig);
                    log("✅ Firebase app initialized");
                } else {
                    log("✅ Firebase already initialized");
                }
                
                const db = firebase.firestore();
                log("✅ Firestore ready");
                
                const storage = firebase.storage();
                log("✅ Storage ready");
                
                document.getElementById('status').innerHTML = '<div class="success">✅ System Connected Successfully!</div>';
                log("✅✅✅ ALL SYSTEMS GO ✅✅✅");
                
            } catch (error) {
                logError("Error: " + error.message);
                document.getElementById('status').innerHTML = '<div class="error">❌ Error: ' + error.message + '</div>';
            }
        }

        log("Starting Firebase check...");
        tryInitialize();
    </script>
</body>
</html>
