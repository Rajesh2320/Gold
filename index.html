<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Order Form</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js"></script>
    <script src="https://unpkg.com/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 {
            color: #c5a028;
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #28a745;
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #dc3545;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🥇 Gold Booking System</h1>
        <p class="subtitle">Secure Gold Orders & Payments</p>
        
        <div id="loadingMessage" class="loading">
            ⏳ Loading system... Please wait
        </div>

        <div id="mainContent" style="display: none;">
            <div id="successMessage" class="success-message" style="display: none;"></div>
            <div id="errorMessage" class="error-message" style="display: none;"></div>
            
            <p style="text-align: center; color: #28a745; margin: 20px 0; font-weight: bold; font-size: 18px;">
                ✅ System Connected Successfully!
            </p>
            
            <div style="background: #f0f8ff; padding: 20px; border-radius: 8px; text-align: center;">
                <p style="color: #333; margin: 10px 0;">Your Gold Booking System is ready</p>
                <p style="color: #666; margin: 10px 0; font-size: 14px;">Database connection verified ✅</p>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration - Get from Vercel environment variables
        const firebaseConfig = {
            apiKey: "AIzaSyCPjnhrb6IGmmDiDSVkmesO7-dewm_6-aI",  // Replace with your NEW API key
            authDomain: "gold-orders.firebaseapp.com",
            projectId: "gold-orders",
            storageBucket: "gold-orders.firebasestorage.app",
            messagingSenderId: "889006387701",
            appId: "1:889006387701:web:c567caa1ec22f95697b0bc"
        };

        function initializeFirebase() {
            try {
                console.log("🔧 Initializing Firebase...");
                
                // Initialize Firebase
                firebase.initializeApp(firebaseConfig);
                const db = firebase.firestore();
                const storage = firebase.storage();
                
                console.log("✅ Firebase initialized successfully!");
                console.log("✅ Firestore ready");
                console.log("✅ Storage ready");
                
                // Initialize EmailJS
                emailjs.init("8KaDRKTZiJkhff6TU");
                console.log("✅ EmailJS initialized");
                
                // Show success screen
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                
                console.log("✅✅✅ ALL SYSTEMS GO! ✅✅✅");
                
            } catch (error) {
                console.error("❌ Error:", error);
                document.getElementById('loadingMessage').innerHTML = 
                    '<div class="error-message"><strong>❌ Error:</strong> ' + error.message + '</div>';
            }
        }

        // Initialize when page loads
        window.addEventListener('load', initializeFirebase);
    </script>
</body>
</html>
