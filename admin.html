<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Gold Orders</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            color: #c5a028;
            font-size: 28px;
        }
        .logout-btn {
            background: #dc3545;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }
        .logout-btn:hover {
            background: #c82333;
        }

        /* Login Section */
        .login-section {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }
        .login-section h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #c5a028;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #c5a028;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
        }
        .login-btn:hover {
            background: #a68a1f;
        }
        .error {
            color: #dc3545;
            margin-top: 10px;
            text-align: center;
        }

        /* Dashboard Section */
        .dashboard-section {
            display: none;
        }

        /* Toggle Switch Section */
        .toggle-section {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }
        .toggle-section h2 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .status-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .status-box {
            padding: 20px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            min-width: 200px;
        }
        .status-box.enabled {
            background: #28a745;
        }
        .status-box.disabled {
            background: #dc3545;
        }
        .toggle-switch {
            display: inline-block;
            position: relative;
            width: 80px;
            height: 40px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 40px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 32px;
            width: 32px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #28a745;
        }
        input:checked + .slider:before {
            transform: translateX(40px);
        }

        /* Stats Section */
        .stats-section {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .stats-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #c5a028;
        }
        .stat-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .stat-value {
            color: #c5a028;
            font-size: 28px;
            font-weight: bold;
        }

        /* Orders Table */
        .orders-section {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .orders-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .orders-table {
            width: 100%;
            border-collapse: collapse;
        }
        .orders-table th {
            background: #f5f5f5;
            padding: 12px;
            text-align: left;
            color: #333;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
        }
        .orders-table td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        .orders-table tr:hover {
            background: #f9f9f9;
        }
        .no-orders {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        /* Diagnostic Message */
        #diagnosticMessage {
            display: none !important;
            animation: slideIn 0.3s ease-in-out;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Section -->
        <div id="loginSection" class="login-section">
            <h2>🔒 Admin Login</h2>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter admin password" onkeypress="if(event.key==='Enter') login()">
            </div>
            <button class="login-btn" onclick="login()">Login</button>
            <div id="loginError"></div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboardSection" class="dashboard-section">
            <!-- Header -->
            <div class="header">
                <h1>🥇 Gold Orders Dashboard</h1>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>

            <!-- Toggle Switch -->
            <div class="toggle-section">
                <h2>Order Status</h2>
                <div id="diagnosticMessage" style="background: #e7f3ff; padding: 15px; border-radius: 6px; margin-bottom: 20px; color: #004085; border-left: 4px solid #0066cc; display: none;">
                    <span id="diagnosticText"></span>
                </div>
                <div class="status-display">
                    <div id="statusBox" class="status-box enabled">✅ ORDERS ENABLED</div>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="orderingToggle" onchange="toggleOrdering()">
                    <span class="slider"></span>
                </label>
                <p id="lastUpdated" style="margin-top: 20px; color: #666; font-size: 14px;">Last checked: --</p>
            </div>

            <!-- Stats -->
            <div class="stats-section">
                <h2>📊 Today's Summary</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total Orders</div>
                        <div class="stat-value" id="totalOrders">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total Weight (kg)</div>
                        <div class="stat-value" id="totalKg">0.00</div>
                    </div>
                </div>
            </div>

            <!-- Orders Table -->
            <div class="orders-section">
                <h2>📋 Today's Orders</h2>
                <table class="orders-table" id="ordersTable">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Time</th>
                            <th>Customer</th>
                            <th>Phone</th>
                            <th>Weight (kg)</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody id="ordersBody">
                        <tr><td colspan="6" class="no-orders">Loading orders...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ===== API CONFIGURATION =====
        const API_URL = "https://script.google.com/macros/s/AKfycbzAyhoG8IEAeEPv2WNDY-93H-iENAwuHCdbHOVhJvdG2vQxf7Ovl1vJ-VczCYVLdXKygQ/exec";
        const GOLD_ORDERS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSz79ejej2mn7QQIKp2zM-icu1Kh6qat7KQU5o-2FC4UnobLxsG5GDKyM33e9ySiJ2tMmxsXbm59k-h/pub?gid=0&single=true&output=csv";
        const ADMIN_SETTINGS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSz79ejej2mn7QQIKp2zM-icu1Kh6qat7KQU5o-2FC4UnobLxsG5GDKyM33e9ySiJ2tMmxsXbm59k-h/pub?gid=1028405274&single=true&output=csv";

        let isLoggedIn = false;
        let orderingEnabled = true;

        // ===== LOGIN =====
        function login() {
            const password = document.getElementById("password").value;
            const loginError = document.getElementById("loginError");
            
            if (!password) {
                loginError.innerHTML = '<div class="error">Please enter password</div>';
                return;
            }
            
            if (password === "admin123") {
                isLoggedIn = true;
                loginError.innerHTML = "";
                document.getElementById("loginSection").style.display = "none";
                document.getElementById("dashboardSection").style.display = "block";
                
                // Load status and data
                loadOrderingStatus();
                refreshData();
                
                // Auto-refresh every 30 seconds
                setInterval(refreshData, 30000);
            } else {
                loginError.innerHTML = '<div class="error">❌ Invalid password</div>';
            }
        }

        // ===== LOGOUT =====
        function logout() {
            isLoggedIn = false;
            document.getElementById("loginSection").style.display = "block";
            document.getElementById("dashboardSection").style.display = "none";
            document.getElementById("password").value = "";
        }

        // ===== LOAD ORDERING STATUS FROM CSV =====
        async function loadOrderingStatus() {
            try {
                console.log("🔍 Loading ordering status from Admin Settings CSV...");
                
                const response = await fetch(ADMIN_SETTINGS_CSV_URL);
                const text = await response.text();
                
                const lines = text.trim().split('\n');
                let status = true;
                
                if (lines.length > 1) {
                    const dataRow = lines[1];
                    const value = dataRow.trim().toLowerCase();
                    
                    if (value === 'false' || value === '0') {
                        status = false;
                    } else {
                        status = true;
                    }
                }
                
                console.log("✅ Ordering status: " + status);
                orderingEnabled = status;
                updateToggleSwitch();
                
                // Update last checked timestamp
                const now = new Date();
                const timeString = now.toLocaleTimeString('en-IN', { 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit',
                    hour12: true
                });
                document.getElementById("lastUpdated").textContent = "Last checked: " + timeString;
                
            } catch (error) {
                console.error("❌ Error loading status:", error);
                orderingEnabled = true;
                updateToggleSwitch();
            }
        }

        // ===== UPDATE TOGGLE SWITCH UI =====
        function updateToggleSwitch() {
            const toggle = document.getElementById("orderingToggle");
            const statusBox = document.getElementById("statusBox");
            
            toggle.checked = orderingEnabled;
            
            if (orderingEnabled) {
                statusBox.classList.remove("disabled");
                statusBox.classList.add("enabled");
                statusBox.textContent = "✅ ORDERS ENABLED";
            } else {
                statusBox.classList.remove("enabled");
                statusBox.classList.add("disabled");
                statusBox.textContent = "❌ ORDERS DISABLED";
            }
        }

        // ===== TOGGLE ORDERING =====
        async function toggleOrdering() {
            const newState = document.getElementById("orderingToggle").checked;
            const diagnostic = document.getElementById("diagnosticMessage");
            const diagnosticText = document.getElementById("diagnosticText");
            
            console.log("📤 Toggling orders to: " + newState);
            
            // Show waiting message
            diagnostic.style.display = "block";
            diagnosticText.innerHTML = "⏳ Sending toggle request to backend...";
            
            try {
                // Send to backend
                await fetch(API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    body: JSON.stringify({
                        action: "setOrderingStatus",
                        enabled: newState
                    })
                });
                
                console.log("✅ Backend updated");
                diagnosticText.innerHTML = "✅ Toggle sent to backend. Waiting for Google Sheet to update...";
                
                // Wait for CSV to update (Google Sheets takes a moment)
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                diagnosticText.innerHTML = "🔍 Verifying update in Google Sheet...";
                
                // Reload status - this will verify the CSV has updated
                await loadOrderingStatus();
                
                // Show confirmation
                const statusText = newState ? "ENABLED" : "DISABLED";
                diagnosticText.innerHTML = `✅ Confirmed! Order status is now ${statusText} in Google Sheet.`;
                
                // Keep message visible for 5 seconds
                setTimeout(() => {
                    diagnostic.style.display = "none";
                }, 5000);
                
            } catch (error) {
                console.error("❌ Error:", error);
                diagnosticText.innerHTML = "❌ Error updating status. Please try again.";
                
                // Revert toggle on error
                setTimeout(() => {
                    document.getElementById("orderingToggle").checked = orderingEnabled;
                    diagnostic.style.display = "none";
                }, 3000);
            }
        }

        // ===== REFRESH DATA =====
        async function refreshData() {
            if (!isLoggedIn) return;
            
            try {
                const response = await fetch(GOLD_ORDERS_CSV_URL);
                const csv = await response.text();
                
                const orders = parseOrders(csv);
                displayOrders(orders);
                
                // Update last checked timestamp
                const now = new Date();
                const timeString = now.toLocaleTimeString('en-IN', { 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit',
                    hour12: true
                });
                document.getElementById("lastUpdated").textContent = "Last checked: " + timeString;
                
            } catch (error) {
                console.error("❌ Error:", error);
            }
        }

        // ===== PARSE ORDERS FROM CSV =====
        function parseOrders(csv) {
            const lines = csv.trim().split('\n');
            const today = getTodayDate();
            let totalKg = 0;
            const todayOrders = [];
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                if (values.length < 8) continue;
                
                const timestamp = values[1] ? values[1].trim() : "";
                
                if (timestamp.includes(today)) {
                    const kg = parseFloat(values[7]) || 0;
                    totalKg += kg;
                    
                    todayOrders.push({
                        orderId: values[0] ? values[0].trim() : "N/A",
                        timestamp: values[1] ? values[1].trim() : "N/A",
                        customerName: values[2] ? values[2].trim() : "N/A",
                        phone: values[4] ? values[4].trim() : "N/A",
                        totalKg: kg.toFixed(3),
                        amount: values[8] ? values[8].trim() : "N/A"
                    });
                }
            }
            
            return { orders: todayOrders, totalKg: totalKg, count: todayOrders.length };
        }

        // ===== DISPLAY ORDERS =====
        function displayOrders(data) {
            document.getElementById("totalOrders").textContent = data.count;
            document.getElementById("totalKg").textContent = data.totalKg.toFixed(3);
            
            const tbody = document.getElementById("ordersBody");
            
            if (data.orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="no-orders">No orders today</td></tr>';
                return;
            }
            
            tbody.innerHTML = data.orders.map(order => `
                <tr>
                    <td>${order.orderId}</td>
                    <td>${order.timestamp}</td>
                    <td>${order.customerName}</td>
                    <td>${order.phone}</td>
                    <td>${order.totalKg}</td>
                    <td>₹${order.amount}</td>
                </tr>
            `).join('');
        }

        // ===== GET TODAY'S DATE =====
        function getTodayDate() {
            const today = new Date();
            const day = String(today.getDate()).padStart(2, '0');
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const year = today.getFullYear();
            return day + "/" + month + "/" + year;
        }
    </script>
</body>
</html>
